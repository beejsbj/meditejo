// Applied to each settings instance, including Flutter's included Gradle build.
// beforeSettings also covers plugins resolved while settings.gradle is evaluated.
// The wrapper has finished extraction before init scripts run.
gradle.gradleHomeDir.parentFile.listFiles().findAll { it.name.endsWith('.zip') }.each {
    if (it.delete()) println "Removed unpacked Gradle distribution archive: ${it.name}"
}
gradle.beforeSettings { settings ->
    settings.pluginManagement.repositories {
        maven {
            name = 'MeditejoStagedPortal'
            url = uri(System.getenv('MEDITEJO_PORTAL_REPO'))
        }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    println "Meditejo staged plugin repository for ${settings.settingsDir}"
}
// Flutter's target-platform limits the app; native library plugins such as JNI
// also need a filter, otherwise CMake configures every NDK target ABI.
gradle.beforeProject { project ->
    project.plugins.withId('com.android.library') {
        project.extensions.getByName('android').defaultConfig.ndk.abiFilters.with {
            clear()
            add('arm64-v8a')
        }
    }
}
