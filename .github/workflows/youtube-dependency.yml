name: YouTube dependency
on:
  push:
    branches: [fork/youtube, fork/yt-followups]
    paths:
      - .github/workflows/youtube-dependency.yml
      - android/app/build.gradle
      - android/build.gradle
      - android/settings.gradle
      - assets/licenses/**
      - tools/meditejo/check_newpipe_dependencies.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  licences:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Licences manifest matches the pinned extractor's runtime closure
        run: python3 -I tools/meditejo/check_newpipe_dependencies.py
  jitpack:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Resolve pinned NewPipeExtractor from JitPack
        run: |
          base=https://jitpack.io/com/github/TeamNewPipe/NewPipeExtractor/v0.26.5
          curl --fail --location --retry 3 --max-time 180 "$base/NewPipeExtractor-v0.26.5.pom" -o /tmp/newpipe.pom
          curl --fail --location --retry 3 --max-time 180 "$base/NewPipeExtractor-v0.26.5.jar" -o /tmp/newpipe.jar
          jar tf /tmp/newpipe.jar | head -30
