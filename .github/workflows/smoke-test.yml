name: Smoke Test

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to test'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - android
          - ios

jobs:
  android-smoke-test:
    name: Android Smoke Test
    if: inputs.platforms == 'both' || inputs.platforms == 'android'
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Cache the Flutter SDK ourselves: flutter-action v2.12.0's built-in cache
      # keys on hashFiles('**/pubspec.lock'), which is re-evaluated after the
      # build and timed out over the iOS build tree, failing a job whose tests
      # had passed (run 37440292038 attempt 2).
      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/flutter
          key: flutter-sdk-${{ runner.os }}-${{ runner.arch }}-3.47.2

      - uses: subosito/flutter-action@v2.12.0
        with:
          flutter-version: '3.47.2'
          cache: false

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Flutter pub get
        if: steps.cache-apk.outputs.cache-hit != 'true'
        run: flutter pub get

      - name: Cache build_runner outputs
        if: steps.cache-apk.outputs.cache-hit != 'true'
        id: cache-buildrunner
        uses: actions/cache@v4
        with:
          path: |
            lib/**/*.g.dart
            lib/**/*.freezed.dart
          key: ${{ runner.os }}-buildrunner-${{ hashFiles('lib/**/*.dart', 'pubspec.yaml', 'pubspec.lock') }}
          restore-keys: ${{ runner.os }}-buildrunner-

      - name: Run build_runner
        if: steps.cache-apk.outputs.cache-hit != 'true' && steps.cache-buildrunner.outputs.cache-hit != 'true'
        run: flutter packages pub run build_runner build --delete-conflicting-outputs

      - name: Cache pigeon outputs
        if: steps.cache-apk.outputs.cache-hit != 'true'
        id: cache-pigeon
        uses: actions/cache@v4
        with:
          path: |
            lib/src/audio_pigeon.g.dart
            lib/src/youtube_api.g.dart
            android/app/src/main/kotlin/meditofoundation/medito/pigeon/AudioPigeon.g.kt
            android/app/src/main/kotlin/meditofoundation/medito/pigeon/YoutubeApi.g.kt
          key: ${{ runner.os }}-pigeon-local-v2-${{ hashFiles('pigeon_conf.dart', 'pigeons/**', 'pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pigeon-local-v2-

      - name: Run pigeon
        if: steps.cache-apk.outputs.cache-hit != 'true' && steps.cache-pigeon.outputs.cache-hit != 'true'
        run: for f in pigeon_conf.dart pigeons/*.dart; do [ -f "$f" ] || continue; flutter pub run pigeon --input "$f" --package_name=medito || exit 1; done

      - name: Cache APK
        id: cache-apk
        uses: actions/cache@v4
        with:
          path: build/app/outputs/apk/prod/release/app-prod-release.apk
          key: ${{ runner.os }}-apk-prod-${{ hashFiles('lib/**/*.dart', 'pubspec.yaml', 'pubspec.lock', 'android/**/*.gradle*', 'android/app/src/**') }}

      - name: Write keystore.properties
        if: steps.cache-apk.outputs.cache-hit != 'true'
        env:
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: printf '%s' "$KEYSTORE_PROPERTIES" > android/keystore.properties

      - name: Write keystore file
        if: steps.cache-apk.outputs.cache-hit != 'true'
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: printf '%s' "$KEYSTORE_FILE" | base64 -d > android/meditokey.jks

      - name: Build APK
        if: steps.cache-apk.outputs.cache-hit != 'true'
        run: |
          flutter build apk --flavor prod --release \
            --obfuscate --split-debug-info=./symbols

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on emulator
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          # Use the AOSP image for local playback and navigation.
          target: default
          profile: pixel_6
          # Keep enough resources for software rendering on CI.
          ram-size: 4096M
          cores: 4
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            curl -Ls "https://get.maestro.mobile.dev" | bash
            adb install build/app/outputs/apk/prod/release/app-prod-release.apk
            adb shell pm grant io.github.beejsbj.meditejo android.permission.POST_NOTIFICATIONS || true
            # Kill Pixel Launcher before the test so it can't ANR and block the app
            adb shell am force-stop com.google.android.apps.nexuslauncher || true
            mkdir -p /tmp/maestro-debug
            .maestro/run_flow.sh /tmp/maestro-debug -e APP_ID=io.github.beejsbj.meditejo .maestro/smoke.yaml

      - name: Host diagnostics (emulator crash)
        # The emulator has vanished mid-flow with no output of its own (adb
        # "device not found", runs 37454547179 and 37462825805). The host
        # kernel log shows whether qemu was OOM-killed or segfaulted.
        if: failure()
        run: |
          free -m || true
          sudo dmesg -T | grep -iE 'oom|killed process|segfault|qemu|emulator|out of memory' | tail -60 || true

      - name: Upload Maestro debug output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-android
          path: /tmp/maestro-debug/
          retention-days: 30
          include-hidden-files: true

      - name: Embed failure screenshots in job summary
        if: failure()
        run: |
          echo "## Android Maestro Smoke Test Failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Screenshots are available in the **maestro-debug-android** artifact above." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Screenshots captured" >> "$GITHUB_STEP_SUMMARY"
          find /tmp/maestro-debug -name '*.png' 2>/dev/null | sort | while read -r img; do
            echo "- \`$(basename "$img")\`" >> "$GITHUB_STEP_SUMMARY"
          done

  ios-smoke-test:
    name: iOS Smoke Test
    if: inputs.platforms == 'both' || inputs.platforms == 'ios'
    runs-on: macos-latest
    environment: prod
    # The XCTest driver Maestro installs can take well over its default
    # startup timeout on a cold CI simulator ("iOS driver not ready in time",
    # run 36309254158), failing the job before any flow runs.
    env:
      MAESTRO_DRIVER_STARTUP_TIMEOUT: 180000

    steps:
      - uses: actions/checkout@v4

      # Cache the Flutter SDK ourselves: flutter-action v2.12.0's built-in cache
      # keys on hashFiles('**/pubspec.lock'), which is re-evaluated after the
      # build and timed out over the iOS build tree, failing a job whose tests
      # had passed (run 37440292038 attempt 2).
      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/flutter
          key: flutter-sdk-${{ runner.os }}-${{ runner.arch }}-3.47.2

      - uses: subosito/flutter-action@v2.12.0
        with:
          flutter-version: '3.47.2'
          cache: false

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Cache iOS app
        id: cache-ios-app
        uses: actions/cache@v4
        with:
          path: build/ios/iphonesimulator/Meditejo.app
          key: ${{ runner.os }}-ios-app-${{ hashFiles('lib/**/*.dart', 'pubspec.yaml', 'pubspec.lock', 'ios/Podfile.lock', 'ios/Runner.xcodeproj/project.pbxproj', 'ios/Runner/**', 'ios/MeditoWidget/**', 'ios/*.entitlements', 'ios/*.plist') }}

      - name: Flutter pub get
        if: steps.cache-ios-app.outputs.cache-hit != 'true'
        run: flutter pub get

      - name: Cache build_runner outputs
        if: steps.cache-ios-app.outputs.cache-hit != 'true'
        id: cache-buildrunner
        uses: actions/cache@v4
        with:
          path: |
            lib/**/*.g.dart
            lib/**/*.freezed.dart
          key: ${{ runner.os }}-buildrunner-${{ hashFiles('lib/**/*.dart', 'pubspec.yaml', 'pubspec.lock') }}
          restore-keys: ${{ runner.os }}-buildrunner-

      - name: Run build_runner
        if: steps.cache-ios-app.outputs.cache-hit != 'true' && steps.cache-buildrunner.outputs.cache-hit != 'true'
        run: flutter packages pub run build_runner build --delete-conflicting-outputs

      - name: Cache pigeon outputs
        if: steps.cache-ios-app.outputs.cache-hit != 'true'
        id: cache-pigeon
        uses: actions/cache@v4
        with:
          path: |
            lib/src/audio_pigeon.g.dart
            lib/src/youtube_api.g.dart
            android/app/src/main/kotlin/meditofoundation/medito/pigeon/AudioPigeon.g.kt
            android/app/src/main/kotlin/meditofoundation/medito/pigeon/YoutubeApi.g.kt
          key: ${{ runner.os }}-pigeon-local-v2-${{ hashFiles('pigeon_conf.dart', 'pigeons/**', 'pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pigeon-local-v2-

      - name: Run pigeon
        if: steps.cache-ios-app.outputs.cache-hit != 'true' && steps.cache-pigeon.outputs.cache-hit != 'true'
        run: for f in pigeon_conf.dart pigeons/*.dart; do [ -f "$f" ] || continue; flutter pub run pigeon --input "$f" --package_name=medito || exit 1; done

      - name: Install pods
        if: steps.cache-ios-app.outputs.cache-hit != 'true'
        working-directory: ios
        run: |
          echo "Xcode: $(xcodebuild -version | head -1)"
          echo "System CocoaPods: $(pod --version)"
          if ! pod --version | grep -q '^1\.16\.'; then
            echo "Installing CocoaPods 1.16.x to match Podfile.lock…"
            gem install cocoapods -v '~> 1.16.2' --no-document
            echo "Installed CocoaPods: $(pod --version)"
          fi
          pod install

      - name: Build iOS simulator app
        if: steps.cache-ios-app.outputs.cache-hit != 'true'
        run: |
          flutter build ios --simulator --no-codesign

      - name: Boot iOS simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
            for d in devices:
              if 'iPhone' in d['name'] and d['isAvailable']:
                print(d['udid'])
                sys.exit(0)
          sys.exit(1)
          ")
          xcrun simctl boot "$DEVICE"
          # Block until SpringBoard is fully ready (not just kernel boot)
          xcrun simctl bootstatus "$DEVICE" -b
          echo "Booted simulator: $DEVICE"

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Smoke test on simulator
        # ~6 min per attempt; run_flow.sh may retry once.
        timeout-minutes: 20
        run: |
          xcrun simctl install booted "build/ios/iphonesimulator/Meditejo.app"
          # Give SpringBoard a few extra seconds to settle before Maestro connects
          sleep 5
          mkdir -p /tmp/maestro-debug
          .maestro/run_flow.sh /tmp/maestro-debug \
            -e APP_ID=io.github.beejsbj.meditejo \
            .maestro/smoke.yaml

      - name: Save iOS app log
        if: failure()
        run: |
          mkdir -p /tmp/maestro-debug
          # The smoke build's executable is "Meditejo" (dev flavor), not Runner.
          xcrun simctl spawn booted log show --last 30m --style compact --info --debug \
            --predicate 'process BEGINSWITH "Meditejo"' > /tmp/maestro-debug/ios-app.log 2>&1 || true

      - name: Upload Maestro debug output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-ios
          path: /tmp/maestro-debug/
          retention-days: 30
          include-hidden-files: true

      - name: Embed failure screenshots in job summary
        if: failure()
        run: |
          echo "## iOS Maestro Smoke Test Failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Screenshots are available in the **maestro-debug-ios** artifact above." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Screenshots captured" >> "$GITHUB_STEP_SUMMARY"
          find /tmp/maestro-debug -name '*.png' 2>/dev/null | sort | while read -r img; do
            echo "- \`$(basename "$img")\`" >> "$GITHUB_STEP_SUMMARY"
          done
