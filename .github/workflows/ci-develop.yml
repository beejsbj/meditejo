# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Flutter

on:
  push:
    tags-ignore:
      - '*'
  pull_request:
    # 'labeled' lets adding the auto-ready label kick off the checks + auto
    # ready-for-review flow on a PR whose CI already ran.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

jobs:
  checks:
    # Don't re-run the full CI when unrelated labels are added.
    if: github.event.action != 'labeled' || github.event.label.name == 'auto-ready'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Fetch the pinned Dharma Seed catalogue
        run: python3 -I tools/meditejo/catalogue.py fetch

      - name: Java version
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter version
        uses: subosito/flutter-action@v2.12.0
        with:
          flutter-version: '3.47.2'

      - name: Flutter Pub Get
        uses: nick-invision/retry@v2
        with:
          timeout_minutes: 5
          max_attempts: 2
          command: flutter pub get

      - name: Check Flutter and Dart versions
        run: |
          flutter --version
          DART_PATH=$(dirname $(which dart))
          echo "DART_PATH=$DART_PATH" >> $GITHUB_ENV

      - name: Cache build_runner outputs
        id: cache-buildrunner
        uses: actions/cache@v4
        with:
          path: |
            lib/**/*.g.dart
            lib/**/*.freezed.dart
          key: ${{ runner.os }}-buildrunner-${{ hashFiles('lib/**/*.dart', 'pubspec.lock') }}
          restore-keys: ${{ runner.os }}-buildrunner-

      - name: Run Riverpod generator
        if: steps.cache-buildrunner.outputs.cache-hit != 'true'
        run: flutter packages pub run build_runner build --delete-conflicting-outputs

      - name: Cache pigeon outputs
        id: cache-pigeon
        uses: actions/cache@v4
        with:
          path: |
            lib/src/audio_pigeon.g.dart
            lib/src/youtube_api.g.dart
            android/app/src/main/kotlin/meditofoundation/medito/pigeon/AudioPigeon.g.kt
            android/app/src/main/kotlin/meditofoundation/medito/pigeon/YoutubeApi.g.kt
          key: ${{ runner.os }}-pigeon-local-v2-${{ hashFiles('pigeon_conf.dart', 'pigeons/**', 'pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pigeon-local-v2-

      - name: Run Pigeon generator
        if: steps.cache-pigeon.outputs.cache-hit != 'true'
        run: for f in pigeon_conf.dart pigeons/*.dart; do [ -f "$f" ] || continue; flutter pub run pigeon --input "$f" --package_name=medito || exit 1; done

      - name: Run Flutter Analyze
        run: timeout 600 nice -n 10 flutter analyze

      - name: Catalogue tool tests
        run: python3 -I -m unittest discover -s tools/meditejo -p 'test_catalogue.py'

      - name: Sound pack tool tests
        run: python3 -I -m unittest discover -s tools/meditejo -p 'test_sound_pack.py'

      - name: Sound library is consistent
        # Offline: the library, NOTICE and assets/sounds agree, and the pack
        # pin matches the pack's sounds. CI downloads no sound: the APK needs
        # only the bundled ones, which are in git.
        run: python3 -I tools/meditejo/sound_pack.py verify

      - name: Release script tests
        run: python3 -I -m unittest discover -s tools/meditejo -p 'test_release.py'

      - name: Sound pipeline tests
        run: |
          python3 -m venv "$RUNNER_TEMP/sounds-venv"
          "$RUNNER_TEMP/sounds-venv/bin/pip" install --quiet numpy
          "$RUNNER_TEMP/sounds-venv/bin/python" -I -m unittest discover -s tools/meditejo -p 'test_sounds.py'

      - name: Run Unit Tests
        run: timeout 2400 nice -n 10 flutter test -j 2

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flutter-artifacts
          path: build/

  # Opt-in: open the PR as a draft and add the 'auto-ready' label, and it is
  # marked ready for review automatically once the checks job passes. Same-repo
  # PRs only — on fork PRs the workflow token is read-only. (For a manual
  # equivalent, Build & Deploy has a mark_ready_for_review dispatch toggle.)
  ready-for-review:
    name: Mark ready for review
    runs-on: ubuntu-latest
    needs: checks
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft &&
      contains(github.event.pull_request.labels.*.name, 'auto-ready')
    permissions:
      pull-requests: write
    steps:
      - name: Mark PR ready for review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
        run: gh pr ready "$PR_NUMBER" --repo "$GH_REPO"
