name: YouTube checks
on:
  push:
    branches: [fork/youtube, fork/yt-followups]
permissions:
  contents: read
jobs:
  dart:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2.12.0
        with:
          flutter-version: '3.47.2'
          cache: false
      - run: timeout 600 nice -n 10 flutter pub get
      - name: Generate bridges and models
        run: |
          for f in pigeon_conf.dart pigeons/*.dart; do
            [ -f "$f" ] && dart run pigeon --input "$f" --package_name=medito
          done
          dart run build_runner build --delete-conflicting-outputs
      - run: timeout 600 nice -n 10 flutter analyze
      - name: YouTube and affected tests, one file at a time (no live network)
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files 'test/services/youtube/*_test.dart' 'test/services/library/*_test.dart' 'test/views/library/*_test.dart' 'test/views/pack/*_test.dart' 'test/views/player/*_test.dart' 'test/utils/youtube_error_message_test.dart' 'test/utils/bundled_licenses_test.dart' 'test/providers/pack_completion_provider_test.dart' 'test/providers/youtube_pack_refresh_test.dart')
          for file in "${files[@]}"; do
            timeout 240 nice -n 10 flutter test --reporter expanded "$file"
          done
