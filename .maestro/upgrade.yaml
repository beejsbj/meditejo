appId: ${APP_ID}
name: Upgrade Verification – Local Home and Timer
---
# Preserve the previous release's app container during the in-place update.
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Home|(?i).*isn't responding.*"
    timeout: 30000
- runFlow:
    when:
      visible: "(?i).*isn't responding.*"
    commands:
      - tapOn:
          text: "Wait"
          optional: true
- extendedWaitUntil:
    visible: "Home"
    timeout: 30000
- takeScreenshot: post-upgrade-home

- runFlow:
    file: read_total_tracks.yaml
    env:
      STATS_KEY: upgraded
- runFlow: local_timer.yaml
- takeScreenshot: post-upgrade-local-home
