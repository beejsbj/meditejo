appId: ${APP_ID}
name: Smoke Test – Local Navigation, Stats, Timer
---
# Fresh local state; the first-launch intro (#87) opens over Home.
- launchApp:
    clearState: true

# CI emulator cold boots can briefly put a launcher ANR above the app.
- runFlow:
    when:
      platform: Android
    commands:
      - runFlow:
          when:
            visible: "(?i).*isn't responding.*"
          commands:
            - tapOn:
                text: "Wait"
                optional: true

# A fresh install sees "What Meditejo is" once; Start lands on Home.
- extendedWaitUntil:
    visible: "Home|One calm place for your practice."
    timeout: 30000
- runFlow:
    when:
      visible: "One calm place for your practice."
    commands:
      - takeScreenshot: first-launch-intro
      - tapOn: "Start"
- extendedWaitUntil:
    visible: "Home"
    timeout: 30000
- tapOn: "Explore"
- extendedWaitUntil:
    visible: "No packs available"
    timeout: 15000
- takeScreenshot: local-catalogue
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Organize Home Layout"
    timeout: 15000
- tapOn: "Home"

# Stats remain available without a network connection.
- runFlow:
    file: read_total_tracks.yaml
    env:
      STATS_KEY: local

# The timer uses generated local silence, so no catalogue audio is required.
- runFlow: local_timer.yaml
- takeScreenshot: local-home
