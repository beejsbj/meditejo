<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meditejo · Practice figures, /*@TITLE@*/</title>
<style>
/*@FONTS@*/
* { box-sizing: border-box; }
body { margin: 0; background: #E9EEF0; color: #18242F; font-family: 'Google Sans', 'Noto Sans Devanagari', 'Noto Serif Tibetan', 'Noto Sans SC', system-ui, sans-serif; line-height: 1.45; }
.script { font-family: 'Noto Sans Devanagari', 'Noto Serif Tibetan', 'Noto Sans SC', 'Google Sans', serif; }
main { max-width: 1180px; margin: 0 auto; padding: 40px 24px 80px; }
h1 { font-weight: 500; font-size: 32px; margin: 0 0 6px; letter-spacing: -0.01em; }
h2 { font-weight: 500; font-size: 22px; margin: 48px 0 8px; }
.lede { color: #5E6F7B; max-width: 760px; margin: 0 0 16px; }
.lede b { color: #18242F; font-weight: 500; }
.rec { background: #fff; border-left: 4px solid #DE8A62; padding: 14px 18px; border-radius: 6px; max-width: 900px; font-size: 14px; }
.rec ul { margin: 6px 0 0; padding-left: 18px; } .rec li { margin: 3px 0; }
.block { margin: 34px 0 8px; }
.bhead { font-size: 20px; font-weight: 500; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.bhead .script { font-size: 16px; color: #5E6F7B; font-weight: 400; }
.bhead .lang { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #5E6F7B; font-weight: 500; }
.desc { margin: 2px 0 2px; color: #5E6F7B; font-size: 14px; }
.why { margin: 0 0 10px; font-size: 13.5px; max-width: 820px; }
.row { display: flex; gap: 12px; padding: 14px; border-radius: 18px; margin-top: 8px; overflow-x: auto; }
.row.light { background: #F2F5F6; color: #18242F; --muted: #5E6F7B; --card: #E4EAEC; }
.row.dark { background: #0E151C; color: #E6EDF0; --muted: #8DA0AC; --card: #162029; }
.tile { flex: 0 0 170px; background: var(--card); border-radius: 18px; overflow: hidden; outline: 2px solid transparent; }
.tile.pick { outline-color: #DE8A62; }
.tile.was { opacity: 0.88; }
.tile .art { display: block; }
.tile .txt { padding: 8px 11px 12px; }
.tag { font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 500; display: flex; justify-content: space-between; }
.badge { background: #DE8A62; color: #fff; border-radius: 8px; padding: 0 6px; letter-spacing: 0.04em; }
.name { font-weight: 500; font-size: 14.5px; line-height: 1.2; margin-top: 3px; }
.says { font-size: 12px; line-height: 1.35; color: var(--muted); margin-top: 4px; }
.gr { font-size: 10.5px; color: var(--muted); margin-top: 5px; opacity: 0.8; }
.lib { display: inline-block; font-size: 10px; margin-left: 6px; padding: 0 5px; border-radius: 6px; border: 1px solid currentColor; opacity: 0.85; }
.flags li { margin: 6px 0; font-size: 14px; max-width: 860px; } .flags b { font-weight: 500; }
code { font-size: 0.92em; }
/* shot mode: one block alone */
body.shotmode { background: #E9EEF0; } body.shotmode main { display: none; }
.shot { width: max-content; min-width: 790px; padding: 4px 18px 18px; }
.shot .desc, .shot .why { max-width: 760px; }
body.shotmode .row { overflow: visible; }
.shot .block { margin: 12px 0 4px; }
.shot.sheet { width: 2280px; columns: 3; column-gap: 20px; }
.shot.sheet .block { break-inside: avoid; display: inline-block; width: 100%; }
.shot.sheet .block { margin: 8px 0 2px; } .shot.sheet .bhead { font-size: 15px; }
.shot.sheet .row { padding: 8px; gap: 8px; margin-top: 4px; }
.shot.sheet .tile .txt { padding: 5px 9px 7px; } .shot.sheet .says, .shot.sheet .gr { display: none; }
</style>
</head>
<body>
<main>
  <h1>Practice figures, /*@TITLE@*/</h1>
  <p class="lede">/*@LEDE@*/</p>
  <div class="rec">/*@RECOMMEND@*/</div>
  <div id="blocks"></div>
  <div id="flagbox">
  <h2>Flagged, not redrawn</h2>
  <p class="lede">The rest of round 1, looked over again. Not redone unasked; these are the ones I'd revisit.</p>
  <ul class="flags" id="flags"></ul>
  </div>
</main>
<script>/*@CORE@*/</script>
<script>/*@GROUNDS@*/</script>
<script>/*@PRIMS@*/</script>
<script>/*@FIGURES@*/</script>
<script>/*@FIGURES2@*/</script>
<script>/*@FIGURES3@*/</script>
<script>/*@APP@*/</script>
</body>
</html>
