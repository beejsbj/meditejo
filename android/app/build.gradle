plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'dev.flutter.flutter-gradle-plugin'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new FileNotFoundException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "meditofoundation.medito"
    compileSdkVersion 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }


    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    project.ext {
        APP_ID = keystoreProperties['appId'] ?: 'io.github.beejsbj.meditejo'
        KEYSTORE_STORE_FILE = keystoreProperties['storeFile'] ? rootProject.file(keystoreProperties['storeFile']) : null
        KEYSTORE_STORE_PASSWORD = keystoreProperties['storePassword']
        KEYSTORE_KEY_ALIAS = keystoreProperties['keyAlias']
        KEYSTORE_KEY_PASSWORD = keystoreProperties['keyPassword']
        VERSION_CODE = flutterVersionCode.toInteger()
        VERSION_NAME = flutterVersionName
    }

    signingConfigs {
        release {
            storeFile project.KEYSTORE_STORE_FILE
            storePassword project.KEYSTORE_STORE_PASSWORD
            keyAlias project.KEYSTORE_KEY_ALIAS
            keyPassword project.KEYSTORE_KEY_PASSWORD
        }
    }

    defaultConfig {
        applicationId project.APP_ID
        minSdkVersion Math.max(flutter.minSdkVersion, 26)
        targetSdkVersion 36 
        versionCode project.VERSION_CODE
        versionName project.VERSION_NAME
        multiDexEnabled true
        manifestPlaceholders += [
            hostName: "meditejo",
            scheme: "meditejo"
        ]
        
        resValue "string", "app_name_override", "Meditejo"

        // Flutter's plugin sets abiFilters to all three ABIs whatever
        // --target-platform says (that flag only picks the engine), so AARs
        // such as sqlite3 and jni shipped armeabi-v7a and x86_64 libraries
        // too. The phone is arm64. Split APKs (F-Droid) set split-per-abi,
        // which AGP rejects together with abiFilters, so leave them to the splits.
        if (!project.hasProperty('split-per-abi')) {
            ndk {
                abiFilters.clear()
                abiFilters.add('arm64-v8a')
            }
        }
    }

    buildFeatures {
        compose true
    }

    packagingOptions {
        pickFirst '**/FlutterError.class'
        pickFirst '**/FlutterError$*.class'
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libjsc.so'
        exclude 'META-INF/*.kotlin_module'
        // Not legal material; stray files from NewPipeExtractor's dependencies.
        exclude 'META-INF/README.md'
        exclude 'META-INF/CHANGES'
    }

    // Licence and notice files are legal packaging resources: when several
    // dependencies ship the same path, merge (concatenate) them rather than
    // excluding or picking one, so no upstream notice is dropped from the APK.
    packaging {
        resources {
            // AGP 8.11.1 excludes these by default. Removing app-level
            // exclude statements alone does not restore the upstream notices.
            excludes -= [
                '/META-INF/LICENSE',
                '/META-INF/LICENSE.txt',
                '/META-INF/NOTICE',
                '/META-INF/NOTICE.txt',
                '/LICENSE',
                '/LICENSE.txt',
                '/NOTICE',
                '/NOTICE.txt',
            ]
            merges += [
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/ASL2.0',
                'META-INF/DEPENDENCIES',
                'META-INF/COPYRIGHT',
                'LICENSE',
                'LICENSE.txt',
                'NOTICE',
                'NOTICE.txt',
            ]
        }
    }

    lintOptions {
        disable 'VitalAnalyzeRelease'
        checkReleaseBuilds false
        abortOnError false
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
        }
        release {
            signingConfig project.KEYSTORE_STORE_FILE ? signingConfigs.release : null
            debuggable false
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions "default"
    productFlavors {
        dev {
            dimension "default"
            // One durable phone install across dev/prod; only the version differs.
            versionNameSuffix "-dev"
        }
        prod {
            dimension "default"
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'

    // Media3 dependencies
    def media3_version = "1.2.1"
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-ui:$media3_version"
    implementation "androidx.media3:media3-session:$media3_version"
    implementation "androidx.media3:media3-common:$media3_version"

    // Other potentially needed dependencies
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.activity:activity-ktx:1.9.2"
    implementation "com.google.android.material:material:1.12.0"

    // Glance App Widget
    implementation "androidx.glance:glance-appwidget:1.2.0-beta01"
    implementation "androidx.glance:glance:1.2.0-beta01"
    implementation "androidx.glance:glance-material:1.2.0-beta01"

    // YouTube link resolution (GPL-3.0-or-later). Pinned to a release tag; if
    // JitPack ever drops the tag, use its commit f9e6bb808f82bf3e4dc1f2a29a16fd376931c8ef.
    implementation "com.github.TeamNewPipe:NewPipeExtractor:v0.26.5"

    // Health Connect (MindfulnessSessionRecord added in 1.1.0, Oct 2025)
    implementation "androidx.health.connect:connect-client:1.1.0"
}


    configurations.all {
        resolutionStrategy {
            force "androidx.work:work-runtime:2.8.1"
            force "androidx.work:work-runtime-ktx:2.8.1"
            // Pin Glance to 1.2.0-beta01. Without this, transitive resolution
            // can pull 1.3.0-alpha01 which requires compileSdk 37 + AGP 9.1.
            force "androidx.glance:glance:1.2.0-beta01"
            force "androidx.glance:glance-appwidget:1.2.0-beta01"
            force "androidx.glance:glance-material:1.2.0-beta01"
        }
    }