plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'dev.flutter.flutter-gradle-plugin'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new FileNotFoundException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
} else {
    throw new FileNotFoundException("keystore.properties file not found. Please create it from keystore.properties.example")
}

android {
    namespace "meditofoundation.medito"
    compileSdkVersion 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }


    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    project.ext {
        APP_ID = keystoreProperties['appId']
        KEYSTORE_STORE_FILE = rootProject.file(keystoreProperties['storeFile'])
        KEYSTORE_STORE_PASSWORD = keystoreProperties['storePassword']
        KEYSTORE_KEY_ALIAS = keystoreProperties['keyAlias']
        KEYSTORE_KEY_PASSWORD = keystoreProperties['keyPassword']
        VERSION_CODE = flutterVersionCode.toInteger()
        VERSION_NAME = flutterVersionName
    }

    signingConfigs {
        release {
            storeFile project.KEYSTORE_STORE_FILE
            storePassword project.KEYSTORE_STORE_PASSWORD
            keyAlias project.KEYSTORE_KEY_ALIAS
            keyPassword project.KEYSTORE_KEY_PASSWORD
        }
    }

    defaultConfig {
        applicationId project.APP_ID
        minSdkVersion Math.max(flutter.minSdkVersion, 26)
        targetSdkVersion 36 
        versionCode project.VERSION_CODE
        versionName project.VERSION_NAME
        multiDexEnabled true
        manifestPlaceholders += [
            hostName: "medito.app",
            scheme: "https"
        ]
        
        resValue "string", "app_name_override", "Medito"
    }

    buildFeatures {
        compose true
    }

    packagingOptions {
        pickFirst '**/FlutterError.class'
        pickFirst '**/FlutterError$*.class'
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libjsc.so'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
        exclude 'META-INF/*.kotlin_module'
    }

    lintOptions {
        disable 'VitalAnalyzeRelease'
        checkReleaseBuilds false
        abortOnError false
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
        }
        release {
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions "default"
    productFlavors {
        dev {
            dimension "default"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
        }
        prod {
            dimension "default"
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'

    // Media3 dependencies
    def media3_version = "1.2.1"
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-ui:$media3_version"
    implementation "androidx.media3:media3-session:$media3_version"
    implementation "androidx.media3:media3-common:$media3_version"

    // Other potentially needed dependencies
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.activity:activity-ktx:1.9.2"
    implementation "com.google.android.material:material:1.12.0"

    // Glance App Widget
    implementation "androidx.glance:glance-appwidget:1.2.0-beta01"
    implementation "androidx.glance:glance:1.2.0-beta01"
    implementation "androidx.glance:glance-material:1.2.0-beta01"

    // Health Connect (MindfulnessSessionRecord added in 1.1.0, Oct 2025)
    implementation "androidx.health.connect:connect-client:1.1.0"
}


    configurations.all {
        resolutionStrategy {
            force "androidx.work:work-runtime:2.8.1"
            force "androidx.work:work-runtime-ktx:2.8.1"
            // Pin Glance to 1.2.0-beta01. Without this, transitive resolution
            // can pull 1.3.0-alpha01 which requires compileSdk 37 + AGP 9.1.
            force "androidx.glance:glance:1.2.0-beta01"
            force "androidx.glance:glance-appwidget:1.2.0-beta01"
            force "androidx.glance:glance-material:1.2.0-beta01"
        }
    }