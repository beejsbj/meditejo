ext.kotlin_version = '2.1.0'

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// Some plugin modules (e.g. home_widget) still default to JVM target 1.8,
// which fails against dependencies compiled for JVM 11 under Flutter 3.44's
// toolchain. Force a consistent target across every module.
subprojects {
    def forceJvmTarget = { project ->
        if (project.plugins.hasPlugin('com.android.library')) {
            project.android.compileOptions.sourceCompatibility = JavaVersion.VERSION_17
            project.android.compileOptions.targetCompatibility = JavaVersion.VERSION_17
        }
        project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions.jvmTarget = '17'
        }
    }
    if (project.state.executed) {
        forceJvmTarget(project)
    } else {
        project.afterEvaluate { p -> forceJvmTarget(p) }
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            name 'JitPackTeamNewPipe'
            url 'https://jitpack.io'
            content {
                // NewPipeExtractor and its nanojson fork are the only
                // artifacts taken from JitPack.
                includeGroup 'com.github.TeamNewPipe'
            }
        }
    }
}

// A plugin (disable_battery_optimization) adds an unscoped JitPack repository
// to every project from its own build.gradle. Drop any JitPack repository
// that is not the scoped one above after EACH project evaluation. With
// configuration-on-demand, a plugin can be evaluated during dependency
// resolution, after the global projectsEvaluated event has already fired.
gradle.afterProject {
    rootProject.allprojects { p ->
        p.repositories.removeAll(p.repositories.findAll {
            it instanceof MavenArtifactRepository &&
                it.url.host == 'jitpack.io' &&
                it.name != 'JitPackTeamNewPipe'
        })
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}